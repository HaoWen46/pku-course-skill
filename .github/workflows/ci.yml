name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uv-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.10.0'
          python-version: '3.11'
          enable-cache: false
      - name: Generate dependency lock for review
        run: |
          uv --version
          uv lock
          cat uv.lock
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
